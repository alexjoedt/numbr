name: Security audit

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # The action defaults to `--all-features`, which would activate
          # optional features (e.g. rust_decimal's `rkyv`) never enabled by
          # this workspace and audit a graph nobody actually builds. Empty
          # this out so it matches plain `cargo deny check` as verified
          # locally and configured in deny.toml.
          arguments: ""
